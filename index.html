<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Auto-refresh a cada 40 minutos para limpeza de cache de memória da TV -->
    <meta http-equiv="refresh" content="2400">
    <title>VisioFlow | Totem Vertical</title>

    <style>
        /* RESET TOTAL E CONFIGURAÇÃO DA TELA VERTICAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #0f172a; /* Azul muito escuro corporativo */
            color: #f8fafc;
            overflow: hidden;
        }

        /* PALCO PRINCIPAL (OCUPA TODA A TELA VERTICAL) */
        .totem-display {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* TELAS INDIVIDUAIS */
        .tela-fase {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - 46px); /* Deixa os 46px do rodapé livre */
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .tela-fase.ativa {
            display: flex;
            opacity: 1;
        }

        /* --- TELA 1: VÍDEO VERTICAL TOTAL --- */
        #fase-video {
            background-color: #000;
            justify-content: center;
            align-items: center;
        }

        #fase-video video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Preenche perfeitamente a tela vertical sem bordas */
        }

        /* --- TELA 2: WIDGET DE CLIMA EXCLUSIVO --- */
        #fase-clima {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            padding: 40px;
            text-align: center;
        }

        .clima-container {
            width: 90%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid #334155;
            border-radius: 24px;
            padding: 40px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .clima-titulo {
            font-size: 2.2rem;
            letter-spacing: 3px;
            color: #eab308; /* Dourado */
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .clima-subtitulo {
            color: #94a3b8;
            font-size: 1.2rem;
            margin-top: 25px;
            letter-spacing: 1px;
        }

        /* --- RODAPÉ PERMANENTE: BOLSA E DÓLAR --- */
        .rodape-financeiro {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 46px;
            background-color: #020617;
            border-top: 1px solid #1e293b;
            z-index: 999;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="totem-display">

        <!-- TELA 1: VÍDEO VERTICAL DO STUDIO MANOEL SANTOS -->
        <section class="tela-fase ativa" id="fase-video">
            <!-- 
                VÍDEO CONFIGURADO:
                - muted e playsinline: Obrigatório para o navegador da TV permitir autoplay sem travar.
                - src="video.mp4": Puxa o arquivo de vídeo do seu repositório.
            -->
            <video id="player-video" autoplay muted playsinline preload="auto">
                <source src="video.mp4" type="video/mp4">
                Seu navegador não suporta a tag de vídeo.
            </video>
        </section>

        <!-- TELA 2: CLIMA DE BELÉM LIMPO E EXCLUSIVO -->
        <section class="tela-fase" id="fase-clima">
            <div class="clima-container">
                <div class="clima-titulo">Belém • Pará</div>
                
                <!-- Script Oficial WeatherWidget.io configurado para Belém -->
                <a class="weatherwidget-io" 
                   href="https://forecast7.com/pt/n1d46n48d50/belem/" 
                   data-label_1="BELÉM" 
                   data-label_2="TEMPO AGORA" 
                   data-font="Roboto" 
                   data-icons="Climacons Animated" 
                   data-theme="pure" 
                   data-basecolor="#0f172a" 
                   data-textcolor="#f8fafc"
                   data-cloudfill="#0f172a">
                   BELÉM TEMPO AGORA
                </a>
                <script>
                !function(d,s,id){
                    var js,fjs=d.getElementsByTagName(s)[0];
                    if(!d.getElementById(id)){
                        js=d.createElement(s);
                        js.id=id;
                        js.src='https://weatherwidget.io/js/widget.min.js';
                        fjs.parentNode.insertBefore(js,fjs);
                    }
                }(document,'script','weatherwidget-io-js');
                </script>

                <div class="clima-subtitulo">Studio Manoel Santos • Bodytech</div>
            </div>
        </section>

        <!-- RODAPÉ PERMANENTE COM AS COTAÇÕES EM TEMPO REAL -->
        <footer class="rodape-financeiro">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
                {
                    "symbols": [
                        { "proName": "BMFBOVESPA:IBOV", "title": "IBOV" },
                        { "proName": "FX_IDC:USDBRL", "title": "Dólar" },
                        { "proName": "FX_IDC:EURBRL", "title": "Euro" },
                        { "description": "Selic", "proName": "ECONOMICS:BRINTR" }
                    ],
                    "showSymbolLogo": false,
                    "isTransparent": true,
                    "displayMode": "adaptive",
                    "colorTheme": "dark",
                    "locale": "br"
                }
                </script>
            </div>
        </footer>

    </div>

    <!-- CONTROLADOR DE TRANSMISSÃO (MÁQUINA DE EVENTOS) -->
    <script>
        const telaVideo = document.getElementById('fase-video');
        const telaClima = document.getElementById('fase-clima');
        const videoElement = document.getElementById('player-video');

        // TEMPO QUE O CLIMA FICARÁ NA TELA: 15 segundos
        const TEMPO_EXIBICAO_CLIMA = 15000; 

        // 1. Inicia tocando o vídeo
        function iniciarTransmissao() {
            videoElement.play().catch(erro => {
                console.log("Aguardando interação ou fallback de autoplay: ", erro);
            });
        }

        // 2. Quando o vídeo TERMINAR (onended), troca para a tela de clima
        videoElement.onended = function() {
            // Esconde vídeo e mostra o clima
            telaVideo.classList.remove('ativa');
            telaClima.classList.add('ativa');

            // Agenda a volta para o vídeo após os 15 segundos
            setTimeout(() => {
                telaClima.classList.remove('ativa');
                telaVideo.classList.add('ativa');
                videoElement.currentTime = 0; // Volta o vídeo para o início
                videoElement.play();
            }, TEMPO_EXIBICAO_CLIMA);
        };

        // Fallback de segurança: Caso o arquivo de vídeo demore a carregar ou falhe, não trava a tela
        videoElement.onerror = function() {
            console.log("Vídeo ainda não encontrado no repositório. Alternando com timer padrão.");
            setTimeout(() => {
                telaVideo.classList.remove('ativa');
                telaClima.classList.add('ativa');
                setTimeout(() => {
                    location.reload();
                }, TEMPO_EXIBICAO_CLIMA);
            }, 10000);
        };

        window.addEventListener('DOMContentLoaded', iniciarTransmissao);
    </script>
</body>
</html>
