<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Auto-refresh a cada 40 minutos para limpeza de cache e liberação de RAM na Smart TV -->
    <meta http-equiv="refresh" content="2400">
    <title>VisioFlow | Manoel Santos Studio Expresso</title>

    <!-- Tipografia Editorial: Playfair Display (Luxo) + Plus Jakarta Sans (Moderno) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* RESET TOTAL E BASE VERTICAL EDITORIAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        :root {
            --ouro-primario: #d4af37;
            --ouro-gradiente: linear-gradient(135deg, #c59f3d 0%, #fef3c7 35%, #b38728 70%, #d4af37 100%);
            --fundo-absoluto: #050505;
            --texto-claro: #ffffff;
            --texto-suave: #d4d4d8;
            --texto-muted: #a1a1aa;
            --borda-fina: rgba(212, 175, 55, 0.25);
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--fundo-absoluto);
            color: var(--texto-claro);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        .totem-display {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--fundo-absoluto);
        }

        /* GERENCIADOR DE TELAS (FASES) */
        .tela-fase {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - 54px); /* Deixa livre a barra de cotações inferior */
            display: none;
            opacity: 0;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tela-fase.ativa {
            display: flex;
            opacity: 1;
        }

        /* --- FASE 1: VÍDEO VERTICAL --- */
        #fase-video {
            background-color: #000;
            justify-content: center;
            align-items: center;
        }

        #fase-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- FASE 2: CLIMA COM DESIGN HUMANO E NÚMEROS GIGANTES --- */
        #fase-clima {
            flex-direction: column;
            justify-content: space-between;
            padding: 70px 50px 40px 50px;
            background: radial-gradient(circle at 50% 10%, #171510 0%, #050505 75%);
        }

        .clima-header-humanizado {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 25px;
        }

        .logo-box-mini {
            max-width: 190px;
        }

        .logo-box-mini img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .local-info {
            text-align: right;
        }

        .cidade-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .cidade-sub {
            font-size: 0.95rem;
            color: var(--ouro-primario);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Bloco Monumental da Temperatura */
        .clima-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            position: relative;
        }

        .hero-temp-wrapper {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            line-height: 0.85;
        }

        .temp-gigante {
            font-size: 11rem;
            font-weight: 800;
            font-family: 'Playfair Display', serif;
            background: var(--ouro-gradiente);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -4px;
        }

        .temp-unidade {
            font-size: 3.5rem;
            font-weight: 400;
            font-family: 'Playfair Display', serif;
            color: var(--ouro-primario);
            margin-top: 20px;
            margin-left: 5px;
        }

        .condicao-frase {
            font-size: 2.2rem;
            font-weight: 600;
            color: #ffffff;
            text-transform: capitalize;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        .sensacao-pill {
            margin-top: 18px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--borda-fina);
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 1.15rem;
            color: var(--ouro-primario);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Grade da Semana em Formato Editorial */
        .semana-editorial {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--borda-fina);
            border-radius: 24px;
            padding: 24px 28px;
        }

        .linha-previsao {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .linha-previsao:last-child {
            border-bottom: none;
        }

        .dia-nome {
            font-size: 1.35rem;
            font-weight: 600;
            color: #ffffff;
            width: 130px;
        }

        .dia-status {
            font-size: 1.25rem;
            color: var(--texto-suave);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dia-graus {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            gap: 16px;
        }

        .grau-alto { color: var(--ouro-primario); }
        .grau-baixo { color: #71717a; }

        /* --- FASE 3: NOTÍCIAS FULL BLEED (CAPA DE REVISTA VIVA) --- */
        #fase-noticias {
            position: relative;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 50px 50px 50px;
        }

        /* Foto de Fundo em Altíssima Definição preenchendo a tela inteira */
